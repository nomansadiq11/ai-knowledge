version: '3.8'

services:
  # Ollama - Local LLM service
  ollama:
    image: ollama/ollama:latest
    container_name: ai-knowledge-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai-knowledge-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Streamlit Web UI
  webui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-knowledge-webui
    ports:
      - "8501:8501"
    volumes:
      - ./uploads:/app/uploads
      - ./chroma_db:/app/chroma_db
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    networks:
      - ai-knowledge-network
    restart: unless-stopped

networks:
  ai-knowledge-network:
    driver: bridge

volumes:
  ollama_data:

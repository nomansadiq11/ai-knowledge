services:

  # Streamlit Web UI
  webui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-knowledge-webui
    ports:
      - "8501:8501"
    volumes:
      - ./uploads:/app/uploads
      - ./chroma_db:/app/chroma_db
    environment:
      # Use host's locally running Ollama (macOS/Windows: host.docker.internal)
      - OLLAMA_HOST=http://host.docker.internal:11434
    networks:
      - ai-knowledge-network
    restart: unless-stopped

networks:
  ai-knowledge-network:
    driver: bridge
